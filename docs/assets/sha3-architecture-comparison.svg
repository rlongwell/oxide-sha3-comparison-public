<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>svg{width:100%;height:100%;max-width:177.778vh;max-height:56.25vw}
svg text{font-family:Arial,Helvetica,sans-serif;fill:#eeeeee}
