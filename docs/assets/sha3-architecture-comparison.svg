svg .rate-cell{fill:#2e2e2e;stroke:#9eb6cd;stroke-width:2}
svg .reject-line{stroke:#e1c28b}</style><rect width="1920" height="1080" fill="#242424"/><text x="100" y="75" font-size="23" class="muted">SHA3-256 · COMPACT vs OXIDE QUARTZ</text><text x="100" y="165" font-size="48">Compact: absorb directly into the state</text><line x1="100" y1="205" x2="1820" y2="205" class="line" stroke-width="3"/><g opacity="1" transform="translate(0 0)"><text x="100" y="270" font-size="30" class="oxide" text-anchor="start">Oxide Quartz</text><g opacity=".65"><rect x="100" y="315" width="210" height="125" rx="12" class="panel"/><text x="205" y="366" font-size="27" class="" text-anchor="middle">AXI Stream</text><text x="205" y="405" font-size="22" class="muted" text-anchor="middle">64-bit words</text><line x1="310" y1="377" x2="350" y2="377" class="line" stroke-width="3"/><path d="M 338 368 L 350 377 L 338 386" fill="none" class="line" stroke-width="3"/><rect x="350" y="315" width="270" height="125" rx="12" class="panel"/><text x="485" y="366" font-size="27" class="" text-anchor="middle">Elastic adapter</text><text x="485" y="405" font-size="22" class="muted" text-anchor="middle">1 byte / clock</text><line x1="620" y1="377" x2="660" y2="377" class="line" stroke-width="3"/><path d="M 648 368 L 660 377 L 648 386" fill="none" class="line" stroke-width="3"/><rect x="660" y="315" width="330" height="125" rx="12" class="panel"/><text x="825" y="366" font-size="27" class="" text-anchor="middle">Block A + Block B</text><text x="825" y="405" font-size="22" class="muted" text-anchor="middle">136 bytes each</text><line x1="990" y1="377" x2="1030" y2="377" class="line" stroke-width="3"/><path d="M 1018 368 L 1030 377 L 1018 386" fill="none" class="line" stroke-width="3"/><rect x="1030" y="315" width="330" height="125" rx="12" class="panel"/><text x="1195" y="366" font-size="27" class="" text-anchor="middle">Keccak state</text><text x="1195" y="405" font-size="22" class="muted" text-anchor="middle">1,600 bits · 24 rounds</text><line x1="1360" y1="377" x2="1400" y2="377" class="line" stroke-width="3"/><path d="M 1388 368 L 1400 377 L 1388 386" fill="none" class="line" stroke-width="3"/><rect x="1400" y="315" width="410" height="125" rx="12" class="panel"/><text x="1605" y="366" font-size="27" class="" text-anchor="middle">Digest register</text><text x="1605" y="405" font-size="22" class="muted" text-anchor="middle">256 bits</text></g></g><g opacity="1" transform="translate(0 0)"><text x="100" y="565" font-size="33" class="ours" text-anchor="start">Compact SHA3-256</text><text x="1810" y="565" font-size="25" class="warm" text-anchor="end">Outlined blocks change</text></g><g opacity="1" transform="translate(0 0)"><rect x="100" y="610" width="210" height="125" rx="12" class="panel"/><text x="205" y="661" font-size="27" class="" text-anchor="middle">AXI Stream</text><text x="205" y="700" font-size="22" class="muted" text-anchor="middle">Same 64-bit words</text></g><g opacity="1" transform="translate(0 0)"><line x1="310" y1="672" x2="350" y2="672" class="line" stroke-width="3"/><path d="M 338 663 L 350 672 L 338 681" fill="none" class="line" stroke-width="3"/><rect x="350" y="610" width="270" height="125" rx="12" class="changed"/><text x="485" y="661" font-size="27" class="warm" text-anchor="middle">Beat buffer</text><text x="485" y="700" font-size="22" class="muted" text-anchor="middle">64 bits</text></g><g opacity="1" transform="translate(0 0)"><line x1="620" y1="672" x2="660" y2="672" class="line" stroke-width="3"/><path d="M 648 663 L 660 672 L 648 681" fill="none" class="line" stroke-width="3"/><rect x="660" y="610" width="330" height="125" rx="12" class="changed"/><text x="825" y="661" font-size="27" class="warm" text-anchor="middle">Aligned XOR</text><text x="825" y="700" font-size="22" class="muted" text-anchor="middle">Direct absorption</text></g><g opacity="1" transform="translate(0 0)"><line x1="990" y1="672" x2="1030" y2="672" class="line" stroke-width="3"/><path d="M 1018 663 L 1030 672 L 1018 681" fill="none" class="line" stroke-width="3"/><rect x="1030" y="610" width="330" height="125" rx="12" class="panel"/><text x="1195" y="661" font-size="27" class="" text-anchor="middle">Keccak state</text><text x="1195" y="700" font-size="22" class="muted" text-anchor="middle">1,600 bits · 24 rounds</text></g><g opacity="1" transform="translate(0 0)"><line x1="1360" y1="672" x2="1400" y2="672" class="line" stroke-width="3"/><path d="M 1388 663 L 1400 672 L 1388 681" fill="none" class="line" stroke-width="3"/><rect x="1400" y="610" width="410" height="125" rx="12" class="changed"/><text x="1605" y="661" font-size="27" class="warm" text-anchor="middle">Digest view</text><text x="1605" y="700" font-size="22" class="muted" text-anchor="middle">Reads the held state</text></g><g opacity="1" transform="translate(0 0)"><text x="660" y="785" font-size="26" class="warm" text-anchor="start">Two full block buffers removed</text></g><g opacity="1" transform="translate(0 0)"><text x="1400" y="785" font-size="26" class="warm" text-anchor="start">No separate digest register</text></g><g opacity="1" transform="translate(0 0)"><text x="100" y="860" font-size="28" class="muted" text-anchor="start">Capture + absorption: separate cycles</text></g><g opacity="1" transform="translate(0 0)"><text x="1050" y="860" font-size="28" class="muted" text-anchor="start">Same 24-round permutation</text></g></svg>